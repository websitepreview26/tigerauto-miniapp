<body>
<div class="shell"><header class="top"><button class="brand" data-go="home" aria-label="TigerAuto — главная"><span class="brandmark" aria-hidden="true"><i></i></span><span><span class="wordmark">Tiger<span>Auto</span></span></span></button><nav class="roles" aria-label="Режим приложения"><button data-role="client">Клиент</button><button data-role="manager">Менеджер</button></nav></header><main id="main" tabindex="-1"></main><footer class="footer"><span>Демо · данные на этом устройстве</span><button id="reset">Сбросить демо</button></footer></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<dialog id="reset-dialog"><h2>Начать заново?</h2><p>Все тестовые обращения, предложения, фотографии и черновики будут удалены с этого устройства.</p><div class="dialog-actions"><button class="secondary" data-close>Отмена</button><button class="primary" id="confirm-reset">Сбросить</button></div></dialog>
<dialog id="lightbox"><button class="text-btn" data-close aria-label="Закрыть фото">Закрыть ✕</button><img alt="Фотография из обращения" id="large-photo"></dialog>
<script>
'use strict';
const $=s=>document.querySelector(s), KEY='tigerauto-demo-v1';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const blankDraft=()=>({type:'replace',glass:'Лобовое',damage:'Скол',brand:'',model:'',year:'',features:[],comment:'',name:'',phone:'',photos:[]});
let db={orders:[],draft:blankDraft(),quotes:{},chats:{},role:'client'};
try{const v=JSON.parse(localStorage.getItem(KEY));if(v&&Array.isArray(v.orders)){db={...db,...v,draft:{...blankDraft(),...v.draft}}}}catch{}
let role=db.role==='manager'?'manager':'client',photoBusy=false,toastTimer;const scrolls=new Map();
function persist(){try{localStorage.setItem(KEY,JSON.stringify(db));return true}catch{toast('Не удалось сохранить: освободите память браузера.');return false}}
function toast(s){$('#toast').textContent=s;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').textContent='',4500)}
const types={replace:'Замена стекла',repair:'Скол или трещина',consult:'Консультация'};
const statuses={new:'На оценке',offer:'Есть предложение',accepted:'Вариант выбран',question:'Есть вопрос'};
const fmt=n=>Number(n).toLocaleString('ru-RU',{maximumFractionDigits:2});
const date=t=>new Date(t).toLocaleDateString('ru-RU',{day:'numeric',month:'short'});
const badge=o=>`<span class="badge ${o.status}"><i class="dot"></i>${statuses[o.status]}</span>`;
function route(){let [page,id]=location.hash.slice(1).split('/');return {page:page||'home',id}}
if('scrollRestoration' in history)history.scrollRestoration='manual';
let currentHash=location.hash;
function go(path){scrolls.set(currentHash,scrollY);if(location.hash==='#'+path){render();scrollTo(0,0)}else location.hash=path}
function back(){if(history.state?.tiger)history.back();else go('home')}
function heading(title,sub,kicker){return `<button class="back" data-back>← Назад</button><h1 class="page-title">${title}</h1>`}
const arrow='<span class="arrow" aria-hidden="true">↗</span>';
function quizProgress(step){return `<div class="quiz-progress" aria-label="Шаг ${step} из 3">${['Задача','Детали','Контакты'].map((v,i)=>`<span class="${i+1<=step?'on':''}"><i>${i+1<step?'✓':i+1}</i>${v}</span>`).join('')}</div>`}
function home(){if(role==='manager')return orders();return `<div class="page narrow quiz-home"><div class="quiz-links"><button class="text-btn" data-go="orders">Мои обращения <span class="count">${db.orders.length}</span></button><button class="text-btn muted" data-go="contacts">Контакты ↗</button></div>${quizProgress(1)}<h1 class="quiz-title">Что нужно сделать?</h1><div class="quiz-options">${[['replace','Заменить стекло'],['repair','Устранить скол или трещину'],['consult','Получить консультацию']].map(([t,title])=>`<button class="quiz-option" data-start="${t}"><span>${title}</span><span aria-hidden="true">→</span></button>`).join('')}</div></div>`}
function field(name,title,placeholder='',extra='',value=db.draft[name]){return `<label class="field"><span>${title}</span><input name="${name}" value="${esc(value)}" placeholder="${placeholder}" ${extra}></label>`}
function select(name,title,values){return `<label class="field"><span>${title}</span><select name="${name}">${values.map(v=>`<option ${db.draft[name]===v?'selected':''}>${v}</option>`).join('')}</select></label>`}
function photos(list,editable=false){return `<div class="photo-strip">${list.map((p,i)=>`<div class="photo"><img src="${esc(p.data)}" alt="Фото ${i+1}: ${esc(p.name)}" data-photo="${i}" tabindex="0" role="button">${editable?`<button type="button" class="remove" data-remove-photo="${i}" aria-label="Удалить фото ${i+1}">×</button>`:''}</div>`).join('')}${editable&&list.length<3?`<label class="upload"><b>＋</b><span>${photoBusy?'Подготовка…':'Добавить фото'}</span><input type="file" accept="image/*" multiple id="photo-input" ${photoBusy?'disabled':''}></label>`:''}</div>`}
function requestForm(){const d=db.draft,contact=route().id==='contact';return `<div class="page narrow quiz-page"><button class="back" ${contact?'data-go="request"':'data-go="home"'}>← Назад</button>${quizProgress(contact?3:2)}<div class="quiz-heading"><h1 class="quiz-title">${contact?'Как с вами связаться?':d.type==='replace'?'Какое стекло меняем?':d.type==='repair'?'Что повреждено?':'Ваш вопрос'}</h1><button class="sample" id="fill-request">Заполнить примером</button></div><form id="${contact?'request-form':'details-form'}">${contact?`<div class="fields">${field('name','Имя','Ваше имя','required maxlength="60" autocomplete="given-name"')}${field('phone','Телефон','+375 (29) 123-45-67','required type="tel" inputmode="tel" autocomplete="tel" minlength="7" maxlength="25"')}</div>`:`<div class="fields">${d.type==='replace'?`<div class="full">${select('glass','Стекло',['Лобовое','Боковое переднее левое','Боковое переднее правое','Боковое заднее левое','Боковое заднее правое','Заднее'])}</div>`:d.type==='repair'?`<div class="full">${select('damage','Повреждение',['Скол','Трещина','Скол и трещина','Не уверен'])}</div>`:''}${d.type!=='consult'?`${field('brand','Марка','Volkswagen','required maxlength="50" autocomplete="off"')}${field('model','Модель','Passat B6','required maxlength="60"')}${field('year','Год','2008',`inputmode="numeric" type="number" min="1950" max="${new Date().getFullYear()+1}" required`)}${d.type==='replace'&&d.glass==='Лобовое'?`<div class="full"><span class="small">Особенности · если знаете</span><div class="chips" style="margin-top:10px">${['Датчик дождя','Обогрев','Камера ADAS','Не знаю'].map(x=>`<label class="chip"><input type="checkbox" name="feature" value="${x}" ${d.features.includes(x)?'checked':''}>${x}</label>`).join('')}</div></div>`:''}`:''}<label class="field full"><span>${d.type==='consult'?'Вопрос':'Комментарий · необязательно'}</span><textarea name="comment" maxlength="1500" placeholder="${d.type==='repair'?'Размер и расположение повреждения':d.type==='consult'?'С чем нужна помощь?':'Что ещё нужно учесть?'}" ${d.type==='consult'?'required':''}>${esc(d.comment)}</textarea></label><div class="full"><span class="small muted" style="display:block;margin:3px 0 11px">Фото · необязательно · до 3 шт.</span><div id="draft-photos">${photos(d.photos,true)}</div></div></div>`}<div class="actions"><button class="primary" type="submit" ${photoBusy?'disabled':''}>${contact?'Создать обращение':'Далее'} <span>→</span></button>${contact?'<span class="small">Тестовая заявка. Без звонков и отправки данных.</span>':''}</div><div id="form-error" class="error" role="alert"></div></form></div>`}
function orders(){return `<div class="page narrow">${heading(role==='manager'?'Входящие обращения':'Мои обращения',role==='manager'?'Откройте заявку, оцените задачу и отправьте предложение клиенту.':'Здесь — ваши заявки, предложения и переписка с менеджером.',role==='manager'?'TIGERAUTO / РАБОЧЕЕ МЕСТО':'TIGERAUTO / ЛИЧНЫЙ КАБИНЕТ')}<div class="service-head" style="margin-top:25px;border-bottom:1px solid var(--ink)"><span class="eyebrow">${role==='manager'?'Все заявки':'Ваши заявки'}</span><span class="small muted">${db.orders.length}</span></div>${db.orders.length?db.orders.slice().reverse().map(o=>`<button class="order" data-go="order/${o.id}"><div class="order-top"><span class="small muted">№ TA-${o.id} · ${date(o.created)}</span>${badge(o)}</div><h3>${esc([o.brand,o.model].filter(Boolean).join(' ')||'Консультация')}</h3><div class="order-meta"><span>${types[o.type]}${o.type==='replace'?' · '+esc(o.glass):o.type==='repair'?' · '+esc(o.damage):''}</span><span>↗</span></div>${o.accepted!=null?`<div class="selected-label">✓ ${esc(o.offer.options[o.accepted].name)} · ${fmt(o.offer.options[o.accepted].price)} BYN</div>`:''}</button>`).join(''):`<div class="empty"><div class="empty-icon">↗</div><h2>${role==='manager'?'Пока всё спокойно':'Начнём с вашего стекла'}</h2><p>${role==='manager'?'Переключитесь в режим клиента и создайте тестовую заявку. Она появится здесь.':'Создайте обращение — менеджер подберёт решение, а вы сможете выбрать подходящее.'}</p><button class="primary" ${role==='manager'?'data-role="client"':'data-start="replace"'}>${role==='manager'?'Перейти в режим клиента':'Подобрать стекло'} ↗</button></div>`}</div>`}
function isPassat(o){return o.type==='replace'&&o.glass==='Лобовое'&&/^volkswagen$/i.test(o.brand.trim())&&/^passat\s*b6$/i.test(o.model.trim())&&+o.year>=2005&&+o.year<=2010}
function quoteDraft(o){if(!db.quotes[o.id])db.quotes[o.id]={options:[{name:'',price:'',note:''}],comment:''};return db.quotes[o.id]}
function quoteForm(o){const q=quoteDraft(o);return `<form id="quote-form" class="offer-form"><div class="block-title" style="margin:0 0 10px"><h2>${o.type==='consult'?'Ответ клиенту':'Ваше предложение'}</h2><button type="button" class="sample" id="fill-quote">↙ Пример</button></div><p class="small muted">${o.type==='replace'?(isPassat(o)?'Доступны примерные цены Passat B6 из референса.':'Укажите стоимость вручную для этого автомобиля.'):'Стоимость ремонта укажите вручную после оценки.'}</p>${o.type==='consult'?'':q.options.map((v,i)=>`<div class="option-edit"><div class="option-heading"><span>${o.type==='replace'?'Вариант '+(i+1):'Оценка ремонта'}</span>${i>0?`<button type="button" data-delete-option="${i}">Удалить</button>`:''}</div><div class="fields">${field('qname'+i,o.type==='replace'?'Стекло / производитель':'Услуга','Название','required maxlength="80"',v.name)}${field('qprice'+i,'Цена, BYN','0','required type="number" min="0.01" max="999999" step="0.01" inputmode="decimal"',v.price)}</div>${field('qnote'+i,'Что включено · необязательно','Стекло, установка…','maxlength="200"',v.note)}</div>`).join('')}${o.type==='replace'&&q.options.length<3?'<button type="button" class="text-btn" id="add-option">＋ Добавить вариант</button>':''}<label class="field" style="margin-top:18px"><span>Комментарий менеджера</span><textarea name="qcomment" maxlength="1500" ${o.type!=='replace'?'required':''} placeholder="Уточните детали предложения…">${esc(q.comment)}</textarea></label><button class="primary" style="width:100%;margin-top:18px" type="submit">${o.type==='consult'?'Отправить ответ':'Отправить предложение'} ↗</button><p class="small muted" style="margin-top:12px">Демонстрация. Клиент увидит ${o.type==='consult'?'ответ':'предложение'} на этом устройстве.</p></form>`}
function offer(o){return `<section><div class="block-title"><h2>${o.type==='consult'?'Ответ менеджера':'Предложение менеджера'}</h2><span class="eyebrow muted">${date(o.offer.sent)}</span></div>${o.offer.options.length?`<p class="small muted">${o.accepted!=null?'Клиент подтвердил выбор.':role==='client'?'Выберите подходящий вариант или задайте вопрос ниже.':'Клиент может выбрать вариант в своём режиме.'}</p>`:''}${o.offer.options.map((v,i)=>`<label class="offer-option"><input type="radio" name="chosen" value="${i}" ${o.accepted===i||o.accepted==null&&o.choice===i?'checked':''} ${role==='manager'||o.accepted!=null?'disabled':''}><span class="offer-info"><b>${esc(v.name)}</b>${v.note?`<small>${esc(v.note)}</small>`:''}</span><span class="price">${fmt(v.price)} <small>BYN</small></span></label>`).join('')}${o.offer.comment?`<div class="notice"><strong>Менеджер TigerAuto</strong>${esc(o.offer.comment).replace(/\n/g,'<br>')}</div>`:''}${o.accepted!=null?`<div class="notice"><strong>✓ ${role==='client'?'Вы выбрали':'Клиент выбрал'}: ${esc(o.offer.options[o.accepted].name)}</strong>${fmt(o.offer.options[o.accepted].price)} BYN · Решение сохранено. Детали визита можно обсудить в переписке.</div>`:role==='client'&&o.offer.options.length?'<button class="primary" id="accept-offer" style="width:100%;margin-top:18px">Подтвердить выбор ↗</button><div id="choice-error" class="error" role="alert"></div>':''}</section>`}
function orderDetail(id){const o=db.orders.find(x=>x.id===id);if(!o)return `<div class="page narrow">${heading('Обращение не найдено','Возможно, демо было сброшено.')}<button class="primary" data-go="orders">К обращениям</button></div>`;const phase=o.accepted!=null?3:o.offer?2:1;return `<div class="page narrow"><button class="back" data-go="orders">← Все обращения</button><div class="detail-head"><span class="eyebrow muted">№ TA-${o.id} · ${date(o.created)}</span>${badge(o)}</div><h1 class="page-title">${esc(o.brand&&o.model?o.brand+' '+o.model:types[o.type])}</h1><p class="intro">${types[o.type]}${o.type==='replace'?' · '+esc(o.glass):o.type==='repair'?' · '+esc(o.damage):''}</p><div class="progress">${[1,2,3].map(i=>`<i class="${i<=phase?'on':''}"></i>`).join('')}</div><div class="progress-labels"><span>Обращение создано</span><span>Предложение</span><span>Ваше решение</span></div>${!o.offer?`<div class="notice"><strong>${role==='client'?'Обращение принято':'Новая задача на оценку'}</strong>${role==='client'?'Для продолжения демо переключитесь в режим «Менеджер» сверху и отправьте предложение.':'Проверьте параметры ниже и подготовьте предложение клиенту.'}</div>`:''}<section class="summary"><h3>Детали обращения</h3>${[['Автомобиль',[o.brand,o.model,o.year].filter(Boolean).join(' · ')||'Не указан'],['Задача',types[o.type]+(o.type==='replace'?' · '+o.glass:o.type==='repair'?' · '+o.damage:'')],...(o.features.length?[['Особенности',o.features.join(', ')]]:[]),['Клиент',o.name],['Телефон',o.phone],...(o.comment?[['Комментарий',o.comment]]:[])].map(([k,v])=>`<div class="data-row"><span>${k}</span><span>${esc(v)}</span></div>`).join('')}${o.photos.length?photos(o.photos):''}</section>${o.offer?offer(o):role==='manager'?quoteForm(o):''}<section class="thread"><div class="block-title" style="margin-top:0"><h2>Переписка</h2><span class="small muted">Клиент ↔ Менеджер</span></div>${o.messages.length?o.messages.map(m=>`<div class="message ${m.role===role?'mine':''}"><small>${m.role==='client'?'Клиент · '+esc(o.name):'Менеджер TigerAuto'} · ${date(m.at)}</small>${esc(m.text)}</div>`).join(''):'<p class="small muted">Здесь можно уточнить детали и обсудить предложение.</p>'}<form class="chat-form" id="chat-form"><label class="sr" for="chat-text">Сообщение</label><textarea id="chat-text" name="message" required maxlength="1500" placeholder="${role==='client'?'Задать вопрос…':'Ответить клиенту…'}">${esc(db.chats[o.id+'-'+role]||'')}</textarea><button type="submit" aria-label="Отправить сообщение">↑</button></form></section></div>`}
function contacts(){return `<div class="page narrow">${heading('Контакты')}<div class="contact-grid"><section class="contact-panel"><h3 style="margin-top:17px">Минск, Куприянова, 4</h3><p>Пн–пт · 09:00–18:00<br>Сб · 09:00–15:00<br>Вс · выходной</p><a class="primary" href="https://yandex.by/maps/?text=Минск%2C%20Куприянова%2C%204" target="_blank" rel="noopener">Открыть карту ↗</a></section><section class="contact-panel"><h3>Задать вопрос</h3><button class="primary" style="width:100%" data-start="consult">Задать вопрос ↗</button></section></div><div class="block-title"><h2>Услуги</h2></div><p class="small muted">Цены «от» из референса сайта. Итоговая стоимость — после подбора и оценки.</p>${[['Замена лобового стекла','130'],['Замена бокового стекла','65'],['Замена заднего стекла','85'],['Ремонт сколов и трещин','20'],['Замена и ремонт с выездом','150']].map(([a,b])=>`<div class="rate"><span>${a}</span><b style="white-space:nowrap">от ${b} BYN</b></div>`).join('')}</div>`}
function render(){const r=route();document.querySelectorAll('[data-role]').forEach(b=>{b.classList.toggle('active',b.dataset.role===role);b.setAttribute('aria-pressed',String(b.dataset.role===role))});$('#main').innerHTML=r.page==='home'?home():r.page==='request'?requestForm():r.page==='orders'?orders():r.page==='contacts'?contacts():r.page==='order'?orderDetail(r.id):home();document.title=(r.page==='order'?'Обращение TA-'+r.id:r.page==='request'?types[db.draft.type]:role==='manager'?'Рабочее место':'Автостёкла в Минске')+' — TigerAuto'}
addEventListener('hashchange',()=>{scrolls.set(currentHash,scrollY);currentHash=location.hash;history.replaceState({tiger:true},'');render();scrollTo(0,scrolls.get(currentHash)||0);$('#main').focus({preventScroll:true})});
function rerenderKeep(){const y=scrollY;render();scrollTo(0,y)}
function currentOrder(){return db.orders.find(o=>o.id===route().id)}
function switchRole(next){role=next;db.role=role;persist();if(route().page==='request')go('home');else rerenderKeep();toast(role==='manager'?'Режим менеджера':'Режим клиента')}

function fillRequest(){Object.assign(db.draft,{brand:'Volkswagen',model:'Passat B6',year:'2008',glass:'Лобовое',damage:'Скол',features:['Датчик дождя'],name:'Алексей',phone:'+375 (29) 123-45-67',comment:db.draft.type==='repair'?'Скол около 8 мм со стороны пассажира. Появился вчера.':db.draft.type==='consult'?'Подскажите, можно ли заменить стекло с датчиком дождя и сколько времени займёт работа?':'Нужна замена лобового стекла. Хочу сравнить варианты.'});const manual=db.draft.photos.filter(p=>!p.demo);db.draft.photos=manual.length<3?[...manual,{...DEMO_PHOTOS[db.draft.type==='repair'?'repair':'replace']}]:manual;persist();rerenderKeep();toast('Тестовые данные и фото заполнены')}
function fillQuote(){const o=currentOrder(),q=quoteDraft(o);if(isPassat(o)){q.options=[{name:'Россия',price:'150',note:'Демонстрационный вариант из референса'},{name:'Китай',price:'195',note:'Демонстрационный вариант из референса'},{name:'AGC',price:'286',note:'Демонстрационный вариант из референса'}];q.comment='Три варианта для Volkswagen Passat B6 (2005–2010). Цены из референса сайта, используются для демонстрации. Комплектацию и итоговую стоимость согласуем перед установкой.'}else if(o.type==='replace'){q.options=[{name:'Вариант 1',price:'',note:''},{name:'Вариант 2',price:'',note:''},{name:'Вариант 3',price:'',note:''}];q.comment='Подготовили три варианта стекла. Уточните производителя, комплектацию и стоимость каждого варианта перед отправкой.'}else if(o.type==='repair'){q.options=[{name:'Ремонт скола',price:'',note:'Окончательное решение после осмотра'}];q.comment='По описанию повреждение можно оценить на ремонт. Приложите крупное фото, если ещё не добавили. Стоимость укажите вручную после оценки.'}else if(o.type==='consult'){q.options=[];q.comment='Здравствуйте! Поможем подобрать решение. Уточните комплектацию стекла и удобное время для визита. Сервис находится на ул. Куприянова, 4.'}persist();rerenderKeep();toast(o.type==='repair'||o.type==='replace'&&!isPassat(o)?'Описание заполнено. Введите стоимость вручную.':'Пример предложения заполнен')}
function openPhoto(i){const list=route().page==='request'?db.draft.photos:currentOrder()?.photos;const p=list?.[i];if(p){$('#large-photo').src=p.data;$('#lightbox').showModal()}}
document.addEventListener('click',e=>{const b=e.target.closest('button,a,[data-photo]');if(!b)return;if(b.dataset.go){go(b.dataset.go);return}if(b.dataset.role){switchRole(b.dataset.role);return}if(b.dataset.start){start(b.dataset.start);return}if(b.hasAttribute('data-back')){back();return}if(b.hasAttribute('data-close')){b.closest('dialog').close();return}if(b.hasAttribute('data-photo')){openPhoto(+b.dataset.photo);return}if(b.hasAttribute('data-remove-photo')){db.draft.photos.splice(+b.dataset.removePhoto,1);persist();rerenderKeep();return}if(b.hasAttribute('data-delete-option')){quoteDraft(currentOrder()).options.splice(+b.dataset.deleteOption,1);persist();rerenderKeep();return}switch(b.id){case 'fill-request':fillRequest();break;case 'fill-quote':fillQuote();break;case 'add-option':{const q=quoteDraft(currentOrder());if(q.options.length<3)q.options.push({name:'',price:'',note:''});persist();rerenderKeep();break}case 'accept-offer':{const o=currentOrder();if(!Number.isInteger(o.choice)){const el=$('#choice-error');el.textContent='Выберите один из предложенных вариантов.';document.querySelector('input[name="chosen"]')?.focus();break}const old=o.status;o.accepted=o.choice;o.status='accepted';if(!persist()){delete o.accepted;o.status=old;break}rerenderKeep();toast('Выбор сохранён. Менеджер увидит ваше решение.');break}case 'reset':$('#reset-dialog').showModal();break;case 'confirm-reset':$('#reset-dialog').close();db={orders:[],draft:blankDraft(),quotes:{},chats:{},role:'client'};role='client';persist();scrolls.clear();go('home');toast('Демонстрационные данные сброшены');break}});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.hasAttribute('data-photo')){e.preventDefault();openPhoto(+e.target.dataset.photo)}});
document.addEventListener('input',e=>{const t=e.target,n=t.name;if(t.closest('#request-form, #details-form')&&n&&n!=='feature'){db.draft[n]=t.value;persist()}if(t.closest('#quote-form')){const q=quoteDraft(currentOrder());if(n==='qcomment')q.comment=t.value;else {const m=n.match(/^q(name|price|note)(\d+)$/);if(m)q.options[+m[2]][m[1]]=t.value}persist()}if(t.id==='chat-text'){db.chats[route().id+'-'+role]=t.value;persist()}});
document.addEventListener('change',e=>{const t=e.target;if(t.name==='feature'){db.draft.features=[...document.querySelectorAll('[name="feature"]:checked')].map(c=>c.value);if(t.value==='Не знаю'&&t.checked)db.draft.features=['Не знаю'];else if(t.checked)db.draft.features=db.draft.features.filter(x=>x!=='Не знаю');persist();rerenderKeep()}if(t.name==='glass'){db.draft.glass=t.value;if(t.value!=='Лобовое')db.draft.features=[];persist();rerenderKeep()}if(t.name==='chosen'){currentOrder().choice=+t.value;persist()}if(t.id==='photo-input')handlePhotos([...t.files])});
async function compressPhoto(file){if(!file.type.startsWith('image/'))throw Error('Выберите файл изображения.');if(file.size>25*1024*1024)throw Error('Фото больше 25 МБ. Выберите файл поменьше.');const url=URL.createObjectURL(file);try{const img=await new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>resolve(im);im.onerror=()=>reject(Error('Не удалось открыть фото. Выберите JPEG, PNG или WebP.'));im.src=url});const scale=Math.min(1,1200/Math.max(img.naturalWidth,img.naturalHeight));const c=document.createElement('canvas');c.width=Math.round(img.naturalWidth*scale);c.height=Math.round(img.naturalHeight*scale);const ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);ctx.drawImage(img,0,0,c.width,c.height);return {name:file.name,data:c.toDataURL('image/jpeg',.72)}}finally{URL.revokeObjectURL(url)}}
async function handlePhotos(files){if(photoBusy)return;const draft=db.draft;photoBusy=true;rerenderKeep();if(files.length>3-draft.photos.length)toast('Можно добавить до трёх фотографий.');for(const f of files.slice(0,3-draft.photos.length)){try{const p=await compressPhoto(f);if(db.draft!==draft)break;draft.photos.push(p);if(!persist())draft.photos.pop()}catch(err){toast(err.message)}}photoBusy=false;if(route().page==='request')rerenderKeep()}
document.addEventListener('submit',e=>{if(e.target.id==='details-form'){e.preventDefault();if(photoBusy)return;const d=db.draft;if(d.type!=='consult'&&(!d.brand.trim()||!d.model.trim())){$('#form-error').textContent='Укажите марку и модель.';return}if(d.type==='consult'&&!d.comment.trim()){$('#form-error').textContent='Напишите ваш вопрос.';return}go('request/contact');return}if(e.target.id==='request-form'){e.preventDefault();if(photoBusy)return;const d=db.draft,phone=d.phone.replace(/\D/g,'');if(d.name.trim().length<2||phone.length<7||phone.length>15){$('#form-error').textContent='Укажите имя (от 2 букв) и корректный телефон (7–15 цифр).';(d.name.trim().length<2?$('[name="name"]'):$('[name="phone"]')).focus();return}if(d.type!=='consult'&&(!d.brand.trim()||!d.model.trim())){$('#form-error').textContent='Укажите марку и модель автомобиля.';return}if(d.type==='consult'&&!d.comment.trim()){$('#form-error').textContent='Напишите ваш вопрос.';return}const id=String(Math.max(1000,...db.orders.map(o=>+o.id))+1);const o={...JSON.parse(JSON.stringify(d)),id,created:Date.now(),status:'new',messages:[]};db.orders.push(o);const old=db.draft;db.draft=blankDraft();if(!persist()){db.orders.pop();db.draft=old;return}go('order/'+id);toast('Обращение TA-'+id+' создано')}else if(e.target.id==='quote-form'){e.preventDefault();const o=currentOrder(),q=quoteDraft(o);if(o.type!=='consult'&&q.options.some(v=>!v.name.trim()||!Number.isFinite(+v.price)||+v.price<=0)){toast('Укажите название и стоимость каждого варианта.');return}if(o.type!=='replace'&&!q.comment.trim()){toast('Добавьте комментарий клиенту.');return}o.offer={options:o.type==='consult'?[]:q.options.map(v=>({...v,price:+v.price})),comment:q.comment,sent:Date.now()};const old=o.status;o.status='offer';if(!persist()){delete o.offer;o.status=old;return}rerenderKeep();toast('Предложение отправлено. Переключитесь в режим клиента.')}else if(e.target.id==='chat-form'){e.preventDefault();const o=currentOrder(),t=$('#chat-text').value.trim();if(!t)return;const old=o.status;o.messages.push({role,text:t,at:Date.now()});if(role==='client'&&o.accepted==null)o.status='question';else if(role==='manager'&&o.accepted==null)o.status=o.offer?'offer':'new';const k=o.id+'-'+role,oldDraft=db.chats[k];delete db.chats[k];if(!persist()){o.messages.pop();o.status=old;db.chats[k]=oldDraft;return}rerenderKeep();$('#chat-text').focus({preventScroll:true});toast('Сообщение сохранено')}});
for(const dialog of document.querySelectorAll('dialog'))dialog.addEventListener('click',e=>{if(e.target===dialog){const r=dialog.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)dialog.close()}});
if(window.visualViewport)visualViewport.addEventListener('resize',()=>{const el=document.activeElement;if(el?.matches('input,textarea,select'))setTimeout(()=>el.scrollIntoView({block:'nearest',behavior:'smooth'}),100)});
addEventListener('storage',e=>{if(e.key===KEY&&e.newValue){try{const next=JSON.parse(e.newValue);db.orders=next.orders;db.quotes=next.quotes;rerenderKeep()}catch{}}});
if(!location.hash)history.replaceState(null,'','#home');currentHash=location.hash;render();
